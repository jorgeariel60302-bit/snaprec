name: 打包 Windows 版

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包工具
        run: pip install pyinstaller

      - name: 下载 ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName .\ffmpeg.exe
          .\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: 冒烟测试（真实录屏几秒）
        run: python tests/smoke_test.py

      - name: 打包 SnapRec.exe
        run: pyinstaller --noconfirm --onefile --windowed --name SnapRec snaprec.py

      - name: 整理发布文件夹
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\SnapRec | Out-Null
          Copy-Item dist\SnapRec.exe package\SnapRec\
          Copy-Item ffmpeg.exe package\SnapRec\
          Copy-Item docs\使用说明.txt package\SnapRec\
          Compress-Archive package\SnapRec -DestinationPath SnapRec-Windows.zip

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: SnapRec-Windows
          path: package/

      - name: 发布 Release（仅打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SnapRec-Windows.zip
